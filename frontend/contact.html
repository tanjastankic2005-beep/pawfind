<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact us — Nađi šapu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="images/paw-icon.svg">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="m-paw" viewBox="0 0 64 64">
        <ellipse cx="32" cy="43" rx="13.5" ry="10.4" fill="currentColor"/>
        <ellipse cx="15.5" cy="27" rx="5.6" ry="7" fill="currentColor" transform="rotate(-20 15.5 27)"/>
        <ellipse cx="26" cy="19" rx="5.8" ry="7.4" fill="currentColor" transform="rotate(-7 26 19)"/>
        <ellipse cx="38" cy="19" rx="5.8" ry="7.4" fill="currentColor" transform="rotate(7 38 19)"/>
        <ellipse cx="48.5" cy="27" rx="5.6" ry="7" fill="currentColor" transform="rotate(20 48.5 27)"/>
      </symbol>
    </defs>
  </svg>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        <span class="wordmark">nađi&nbsp;<span class="caron-wrap">s<svg><use href="#m-paw"></use></svg></span>apu</span>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link" data-i18n="nav.home">Home</a>
        <a href="pets.html" class="nav-link" data-i18n="nav.browsePets">Browse Pets</a>
        <a href="favorites.html" class="nav-link" data-i18n="nav.favorites">Favorites</a>
        <a href="login.html" class="nav-link" data-i18n="nav.login">Log in</a>
        <a href="register.html" class="nav-link nav-cta" data-i18n="nav.signup">Sign up</a>
      </nav>

      <button class="nav-toggle" aria-label="Open menu">☰</button>

    </div>
  </header>

  <main>
    <section class="form-section">
      <div class="container container-narrow">

        <h1 class="page-title" data-i18n="contact.pageTitle">Contact us</h1>
        <p class="page-subtitle" data-i18n="contact.pageSubtitle">
          Questions, feedback, or something not working right? Send us a message.
        </p>

        <form id="contactForm" class="form" novalidate>

          <div class="form-row">
            <div class="form-group">
              <label for="contactName"><span data-i18n="contact.nameLabel">Your name</span> <span class="required">*</span></label>
              <input type="text" id="contactName" name="name">
              <p class="field-error" id="error-name"></p>
            </div>

            <div class="form-group">
              <label for="contactEmail"><span data-i18n="contact.emailLabel">Email</span> <span class="required">*</span></label>
              <input type="email" id="contactEmail" name="email">
              <p class="field-error" id="error-email"></p>
            </div>
          </div>

          <div class="form-group">
            <label for="contactMessage"><span data-i18n="contact.messageLabel">Message</span> <span class="required">*</span></label>
            <textarea id="contactMessage" name="message" rows="6"
              placeholder="How can we help?" data-i18n-placeholder="contact.messagePlaceholder"></textarea>
            <p class="field-error" id="error-message"></p>
          </div>

          <button type="submit" class="btn btn-primary" id="contactSubmitButton" data-i18n="contact.sendButton">
            Send message
          </button>

        </form>

        <div id="contactFormMessage"></div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">

      <div class="footer-brand">
        <span class="wordmark">nađi&nbsp;<span class="caron-wrap">s<svg><use href="#m-paw"></use></svg></span>apu</span>
        <p class="footer-tagline" data-i18n="footer.tagline">Find your new best friend.</p>
      </div>

      <nav class="footer-nav">
        <a href="pets.html" data-i18n="nav.browsePets">Browse Pets</a>
        <a href="favorites.html" data-i18n="nav.favorites">Favorites</a>
        <a href="login.html" data-i18n="nav.login">Log in</a>
        <a href="register.html" data-i18n="nav.signup">Sign up</a>
      </nav>

    </div>

    <div class="container footer-bottom">
      <p data-i18n="footer.copyright">© 2026 Nađi šapu. A student project by Tanja Stankic.</p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/contact.js"></script>
</body>
</html>
