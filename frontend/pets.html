<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Pets — Nađi šapu</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="images/paw-icon.svg">
  <link rel="stylesheet" href="css/style.css">

</head>
<body>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="m-paw" viewBox="0 0 64 64">
        <ellipse cx="32" cy="43" rx="13.5" ry="10.4" fill="currentColor"/>
        <ellipse cx="15.5" cy="27" rx="5.6" ry="7" fill="currentColor" transform="rotate(-20 15.5 27)"/>
        <ellipse cx="26" cy="19" rx="5.8" ry="7.4" fill="currentColor" transform="rotate(-7 26 19)"/>
        <ellipse cx="38" cy="19" rx="5.8" ry="7.4" fill="currentColor" transform="rotate(7 38 19)"/>
        <ellipse cx="48.5" cy="27" rx="5.6" ry="7" fill="currentColor" transform="rotate(20 48.5 27)"/>
      </symbol>
    </defs>
  </svg>

  <!-- ZAGLAVLJE -->
  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        <span class="wordmark">nađi&nbsp;<span class="caron-wrap">s<svg><use href="#m-paw"></use></svg></span>apu</span>
      </a>

      <nav class="main-nav" id="mainNav"></nav>

      <button class="nav-toggle" aria-label="Open menu">☰</button>

    </div>
  </header>

  <main>

    <section class="page-head">
      <div class="container">
        <h1 class="page-title" data-i18n="pets.pageTitle">Meet our pets</h1>
        <p class="page-tagline" data-i18n="pets.tagline">Their story can begin with you.</p>
        <p class="page-subtitle" id="petsCount">Loading…</p>
      </div>
    </section>
    <section class="filters-section">
      <div class="container">
        <div class="filters">

          <input
            type="search"
            id="searchInput"
            class="filter-input"
            placeholder="Search by name…"
            data-i18n-placeholder="pets.searchPlaceholder"
            aria-label="Search pets by name">

          <select id="speciesFilter" class="filter-select" aria-label="Species">
            <option value="" data-i18n="pets.allSpecies">All species</option>
            <option value="dog" data-i18n="pets.dogs">Dogs</option>
            <option value="cat" data-i18n="pets.cats">Cats</option>
          </select>

          <select id="genderFilter" class="filter-select" aria-label="Gender">
            <option value="" data-i18n="pets.anyGender">Any gender</option>
            <option value="male" data-i18n="pets.male">Male</option>
            <option value="female" data-i18n="pets.female">Female</option>
          </select>

          <select id="ageFilter" class="filter-select" aria-label="Age">
            <option value="" data-i18n="pets.anyAge">Any age</option>
            <option value="baby" data-i18n="pets.baby">Baby</option>
            <option value="young" data-i18n="pets.young">Young</option>
            <option value="adult" data-i18n="pets.adult">Adult</option>
            <option value="senior" data-i18n="pets.senior">Senior</option>
          </select>

          <select id="sizeFilter" class="filter-select" aria-label="Size">
            <option value="" data-i18n="pets.anySize">Any size</option>
            <option value="small" data-i18n="pets.small">Small</option>
            <option value="medium" data-i18n="pets.medium">Medium</option>
            <option value="large" data-i18n="pets.large">Large</option>
          </select>

          <select id="locationFilter" class="filter-select" aria-label="Location">
            <option value="" data-i18n="pets.anyLocation">Any location</option>
            <option value="Banja Luka">Banja Luka</option>
            <option value="Sarajevo">Sarajevo</option>
            <option value="Tuzla">Tuzla</option>
            <option value="Mostar">Mostar</option>
          </select>

          <select id="personalityFilter" class="filter-select" aria-label="Personality">
            <option value="" data-i18n="pets.anyPersonality">Any personality</option>
            <option value="friendly" data-i18n="pets.friendly">Friendly</option>
            <option value="playful" data-i18n="pets.playful">Playful</option>
            <option value="calm" data-i18n="pets.calm">Calm</option>
            <option value="energetic" data-i18n="pets.energetic">Energetic</option>
            <option value="affectionate" data-i18n="pets.affectionate">Affectionate</option>
          </select>

          <select id="sortSelect" class="filter-select" aria-label="Sort by">
            <option value="newest" data-i18n="pets.sortNewest">Newest first</option>
            <option value="name-asc" data-i18n="pets.sortNameAsc">Name A–Z</option>
            <option value="name-desc" data-i18n="pets.sortNameDesc">Name Z–A</option>
            <option value="youngest" data-i18n="pets.sortYoungest">Youngest first</option>
            <option value="oldest" data-i18n="pets.sortOldest">Oldest first</option>
          </select>

          <button id="resetFilters" class="btn btn-ghost btn-sm" data-i18n="pets.reset">Reset</button>

        </div>
      </div>
    </section>

    <section class="pets-section">
      <div class="container">
        <!-- KARTICE PIŠE JAVASCRIPT — ovdje je namjerno prazno -->
        <div class="pets-grid" id="petsGrid"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">

      <div class="footer-brand">
        <span class="wordmark">nađi&nbsp;<span class="caron-wrap">s<svg><use href="#m-paw"></use></svg></span>apu</span>
        <p class="footer-tagline" data-i18n="footer.tagline">Find your new best friend.</p>
      </div>

      <nav class="footer-nav">
        <a href="pets.html" data-i18n="nav.browsePets">Browse Pets</a>
        <a href="favorites.html" data-i18n="nav.favorites">Favorites</a>
        <a href="login.html" data-i18n="nav.login">Log in</a>
        <a href="register.html" data-i18n="nav.signup">Sign up</a>
      </nav>

    </div>

    <div class="container footer-bottom">
      <p data-i18n="footer.copyright">© 2026 Nađi šapu. A student project by Tanja Stankic.</p>
    </div>
  </footer>

  <script src="js/i18n.js"></script>
  <script src="js/main.js"></script>
   <script src="js/api.js"></script>
  <script src="js/pets.js"></script>
</body>
</html>
