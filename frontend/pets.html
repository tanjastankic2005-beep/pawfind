<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Pets — PawFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ZAGLAVLJE -->
  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        <span class="logo-icon">🐾</span>
        <span class="logo-text">PawFind</span>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="pets.html" class="nav-link">Browse Pets</a>
        <a href="favorites.html" class="nav-link">Favorites</a>
        <a href="login.html" class="nav-link">Log in</a>
        <a href="register.html" class="nav-link nav-cta">Sign up</a>
      </nav>

      <button class="nav-toggle" aria-label="Open menu">☰</button>

    </div>
  </header>

  <main>

    <section class="page-head">
      <div class="container">
        <h1 class="page-title">Meet our pets</h1>
        <p class="page-subtitle" id="petsCount">Loading…</p>
      </div>
    </section>
    <section class="filters-section">
      <div class="container">
        <div class="filters">

          <input
            type="search"
            id="searchInput"
            class="filter-input"
            placeholder="Search by name…"
            aria-label="Search pets by name">

          <select id="speciesFilter" class="filter-select" aria-label="Species">
            <option value="">All species</option>
            <option value="dog">Dogs</option>
            <option value="cat">Cats</option>
          </select>

          <select id="genderFilter" class="filter-select" aria-label="Gender">
            <option value="">Any gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
          </select>

          <select id="ageFilter" class="filter-select" aria-label="Age">
            <option value="">Any age</option>
            <option value="baby">Baby</option>
            <option value="young">Young</option>
            <option value="adult">Adult</option>
            <option value="senior">Senior</option>
          </select>

          <select id="sizeFilter" class="filter-select" aria-label="Size">
            <option value="">Any size</option>
            <option value="small">Small</option>
            <option value="medium">Medium</option>
            <option value="large">Large</option>
          </select>

          <select id="locationFilter" class="filter-select" aria-label="Location">
            <option value="">Any location</option>
            <option value="Banja Luka">Banja Luka</option>
            <option value="Sarajevo">Sarajevo</option>
            <option value="Tuzla">Tuzla</option>
            <option value="Mostar">Mostar</option>
          </select>

          <select id="personalityFilter" class="filter-select" aria-label="Personality">
            <option value="">Any personality</option>
            <option value="friendly">Friendly</option>
            <option value="playful">Playful</option>
            <option value="calm">Calm</option>
            <option value="energetic">Energetic</option>
            <option value="affectionate">Affectionate</option>
          </select>

          <select id="sortSelect" class="filter-select" aria-label="Sort by">
            <option value="newest">Newest first</option>
            <option value="name-asc">Name A–Z</option>
            <option value="name-desc">Name Z–A</option>
            <option value="youngest">Youngest first</option>
            <option value="oldest">Oldest first</option>
          </select>

          <button id="resetFilters" class="btn btn-ghost btn-sm">Reset</button>

        </div>
      </div>
    </section>
    
    <section class="pets-section">
      <div class="container">
        <!-- KARTICE PIŠE JAVASCRIPT — ovdje je namjerno prazno -->
        <div class="pets-grid" id="petsGrid"></div>
      </div>
    </section>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">

      <div class="footer-brand">
        <span class="logo-icon">🐾</span> PawFind
        <p class="footer-tagline">Find your new best friend.</p>
      </div>

      <nav class="footer-nav">
        <a href="pets.html">Browse Pets</a>
        <a href="favorites.html">Favorites</a>
        <a href="login.html">Log in</a>
        <a href="register.html">Sign up</a>
      </nav>

    </div>

    <div class="container footer-bottom">
      <p>© 2026 PawFind. A student project by Tanja Stankic.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
   <script src="js/api.js"></script>
  <script src="js/pets.js"></script>
</body>
</html>
