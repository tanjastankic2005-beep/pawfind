<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in — PawFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        <span class="logo-icon">🐾</span>
        <span class="logo-text">PawFind</span>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="pets.html" class="nav-link">Browse Pets</a>
        <a href="favorites.html" class="nav-link">Favorites</a>
        <a href="login.html" class="nav-link">Log in</a>
        <a href="register.html" class="nav-link nav-cta">Sign up</a>
      </nav>

      <button class="nav-toggle" aria-label="Open menu">☰</button>

    </div>
  </header>

  <main>
    <section class="form-section">
      <div class="container container-tiny">

        <div class="auth-card">

          <h1 class="auth-title">Welcome back</h1>
          <p class="auth-subtitle">Log in to see your favourites and applications.</p>

          <form id="loginForm" class="form form-flat" novalidate>

            <div class="form-group">
              <label for="loginEmail">Email</label>
              <input type="email" id="loginEmail" name="email" autocomplete="email">
              <p class="field-error" id="error-loginEmail"></p>
            </div>

            <div class="form-group">
              <label for="loginPassword">Password</label>
              <input type="password" id="loginPassword" name="password" autocomplete="current-password">
              <p class="field-error" id="error-loginPassword"></p>
            </div>

            <button type="submit" class="btn btn-primary btn-block" id="loginButton">
              Log in
            </button>

          </form>

          <div id="formMessage"></div>

          <p class="auth-switch">
            No account yet? <a href="register.html">Sign up</a>
          </p>

        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">

      <div class="footer-brand">
        <span class="logo-icon">🐾</span> PawFind
        <p class="footer-tagline">Find your new best friend.</p>
      </div>

      <nav class="footer-nav">
        <a href="pets.html">Browse Pets</a>
        <a href="favorites.html">Favorites</a>
        <a href="login.html">Log in</a>
        <a href="register.html">Sign up</a>
      </nav>

    </div>

    <div class="container footer-bottom">
      <p>© 2026 PawFind. A student project by Tanja Stankic.</p>
    </div>
  </footer>

  <script src="js/main.js"></script>
  <script src="js/api.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
