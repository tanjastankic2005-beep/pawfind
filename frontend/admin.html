<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — PawFind</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="container header-inner">

      <a href="index.html" class="logo">
        <span class="logo-icon">🐾</span>
        <span class="logo-text">PawFind</span>
      </a>

      <nav class="main-nav">
        <a href="index.html" class="nav-link">Home</a>
        <a href="pets.html" class="nav-link">Browse Pets</a>
        <a href="favorites.html" class="nav-link">Favorites</a>
        <a href="login.html" class="nav-link">Log in</a>
        <a href="register.html" class="nav-link nav-cta">Sign up</a>
      </nav>

      <button class="nav-toggle" aria-label="Open menu">☰</button>

    </div>
  </header>

  <main>

    <section class="page-head">
      <div class="container">
        <h1 class="page-title">Admin dashboard</h1>
        <p class="page-subtitle" id="adminSubtitle">Loading…</p>
      </div>
    </section>

    <!-- Poruka ako korisnik nema pravo -->
    <div class="container" id="adminGuard"></div>

    <!-- Cijela ploča, skrivena dok se ne potvrdi da si admin -->
    <div id="adminPanel" class="hidden">

      <section class="container">
        <div class="profile-stats" id="statsGrid"></div>
      </section>

      <section class="container">
        <div class="tabs">
          <button class="tab is-active" data-tab="pets">Pets</button>
          <button class="tab" data-tab="applications">Applications</button>
        </div>
      </section>

      <!-- ============ LJUBIMCI ============ -->
      <section class="container tab-panel" id="panel-pets">

        <div class="panel-head">
          <h2 class="section-subtitle">Manage pets</h2>
          <button class="btn btn-primary btn-sm" id="newPetButton">+ Add pet</button>
        </div>

        <form id="petForm" class="form hidden">

          <input type="hidden" id="petId">

          <h3 class="form-title" id="petFormTitle">Add a new pet</h3>

          <div class="form-row">
            <div class="form-group">
              <label for="petName">Name <span class="required">*</span></label>
              <input type="text" id="petName">
            </div>
            <div class="form-group">
              <label for="petBreed">Breed</label>
              <input type="text" id="petBreed">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="petSpecies">Species <span class="required">*</span></label>
              <select id="petSpecies">
                <option value="dog">Dog</option>
                <option value="cat">Cat</option>
              </select>
            </div>
            <div class="form-group">
              <label for="petAge">Age (years) <span class="required">*</span></label>
              <input type="number" id="petAge" min="0" max="30">
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="petGender">Gender <span class="required">*</span></label>
              <select id="petGender">
                <option value="female">Female</option>
                <option value="male">Male</option>
              </select>
            </div>
            <div class="form-group">
              <label for="petSize">Size <span class="required">*</span></label>
              <select id="petSize">
                <option value="small">Small</option>
                <option value="medium">Medium</option>
                <option value="large">Large</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="petLocation">Location <span class="required">*</span></label>
              <input type="text" id="petLocation">
            </div>
            <div class="form-group">
              <label for="petPersonality">Personality</label>
              <select id="petPersonality">
                <option value="">—</option>
                <option value="friendly">Friendly</option>
                <option value="playful">Playful</option>
                <option value="calm">Calm</option>
                <option value="energetic">Energetic</option>
                <option value="affectionate">Affectionate</option>
              </select>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="petImage">Image path</label>
              <input type="text" id="petImage" placeholder="images/pet-1.jpg">
            </div>
            <div class="form-group">
              <label for="petStatus">Status</label>
              <select id="petStatus">
                <option value="available">Available</option>
                <option value="adopted">Adopted</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label for="petDescription">Description</label>
            <textarea id="petDescription" rows="3"></textarea>
          </div>

          <fieldset class="form-group">
            <legend>Details</legend>
            <label class="checkbox"><input type="checkbox" id="petVaccinated"><span>Vaccinated</span></label>
            <label class="checkbox"><input type="checkbox" id="petNeutered"><span>Neutered / spayed</span></label>
            <label class="checkbox"><input type="checkbox" id="petKids"><span>Good with kids</span></label>
            <label class="checkbox"><input type="checkbox" id="petDogs"><span>Good with dogs</span></label>
            <label class="checkbox"><input type="checkbox" id="petCats"><span>Good with cats</span></label>
          </fieldset>

          <div id="petFormMessage"></div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary" id="petSubmitButton">Save pet</button>
            <button type="button" class="btn btn-ghost" id="petCancelButton">Cancel</button>
          </div>

        </form>

        <div class="table-wrap">
          <table class="admin-table">
            <thead>
              <tr>
                <th>Pet</th>
                <th>Species</th>
                <th>Age</th>
                <th>Location</th>
                <th>Status</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="petsTableBody"></tbody>
          </table>
        </div>

      </section>

      <!-- ============ PRIJAVE ============ -->
      <section class="container tab-panel hidden" id="panel-applications">
        <h2 class="section-subtitle">All applications</h2>
        <div class="applications-list" id="adminApplications"></div>
      </section>

    </div>

  </main>

  <footer class="site-footer">
    <div class="container footer-inner">

      <div class="footer-brand">
        <span class="logo-icon">🐾</span> PawFind
        <p class="footer-tagline">Find your new best friend.</p>
      </div>

      <nav class="footer-nav">
        <a href="pets.html">Browse Pets</a>
        <a href="favorites.html">Favorites</a>
        <a href="login.html">Log in</a>
        <a href="register.html">Sign up</a>
      </nav>

    </div>

    <div class="container footer-bottom">
      <p>© 2026 PawFind. A student project by Tanja Stankic.</p>
    </div>
  </footer>

  <script src="js/api.js"></script>
  <script src="js/main.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
